<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0b">
  <title>CS2 MarketUZ</title>
  <link rel="stylesheet" href="/miniapp/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="CS2 MarketUZ bosh sahifasi"><span class="brand-mark">CS<span>2</span></span><span class="brand-name">MARKET<span>UZ</span></span></a>
      <button class="icon-btn" id="profileBtn" aria-label="Profil">◉</button>
    </header>

    <main>
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow"><span class="live-dot"></span> CS2 SKIN KATALOGI</p>
          <h1>Bozorni bil.<br><span>Tanlovni qil.</span></h1>
          <p class="hero-description">Sevimli skinlaringiz narxini kuzating. Skinport bozoridagi takliflarni so‘mda ko‘ring.</p>
          <a class="hero-link" href="#catalog">Katalogni ko‘rish <span aria-hidden="true">↘</span></a>
        </div>
        <div class="hero-art" aria-hidden="true"><span class="art-orbit orbit-one"></span><span class="art-orbit orbit-two"></span><span class="art-cross">✳</span><span class="art-tag">UZ / MARKET</span><span class="art-index">01 — 26</span></div>
      </section>

      <section class="search-wrap" aria-label="Katalog qidiruvi">
        <label for="searchInput">Skinni tez toping</label>
        <div class="search-box"><span aria-hidden="true">⌕</span><input id="searchInput" placeholder="AK-47 Redline, AWP Asiimov..." autocomplete="off"><span class="search-hint" aria-hidden="true">/</span></div>
      </section>

      <section class="category-strip" id="catalog"><div class="section-head"><div><span class="eyebrow">KO‘RIB CHIQISH</span><h2>Kategoriyalar</h2></div></div><div id="categoryList" class="category-list"></div></section>

      <section class="catalog-heading">
        <div class="section-head"><div><span class="eyebrow">SKINPORT KATALOGI</span><h2 id="catalogTitle">Skinlar katalogi</h2></div><button class="text-btn" id="refreshBtn"><span aria-hidden="true">↻</span> Yangilash</button></div>
        <label class="sort-control"><span>Saralash</span><select id="sortSelect" aria-label="Skinlarni saralash"><option value="price-asc">Narx: arzonidan</option><option value="price-desc">Narx: qimmatidan</option><option value="name">Nom bo‘yicha</option></select></label>
      </section>
      <div id="status" class="status">Ma’lumotlar yuklanmoqda...</div>
      <section id="skinGrid" class="skin-grid" aria-live="polite"></section>
    </main>

    <nav class="bottom-nav" aria-label="Asosiy navigatsiya">
      <button class="nav-item active" data-view="market"><span>⌂</span>Bozor</button>
      <button class="nav-item" data-view="favorites"><span>☆</span>Sevimlilar</button>
      <button class="nav-item" data-view="alerts"><span>◌</span>Signallar</button>
      <button class="nav-item" data-view="marketplace"><span>♢</span>Savdo</button>
      <button class="nav-item" data-view="profile"><span>◉</span>Profil</button>
    </nav>
  </div>
  <dialog id="detailDialog"><button class="dialog-close" id="closeDialog">×</button><div id="detailContent"></div></dialog>
  <script src="/miniapp/app.js"></script>
</body>
</html>
